name: test

# Runs the unit suite on every push and pull request.
#
# Two jobs, because the suite has two halves. Most of it is plain logic (name
# sanitising, alias construction, managed-block round-tripping, deny-rule
# resync, seeding) and runs anywhere, so Linux checks it across every Node
# version we support. The rest exercises the macOS machinery the tool is
# actually for: compiling real launchers with osacompile and reading them
# back, bundle identifiers and plists, the launch helper's decisions under
# osascript. Those tests skip themselves off macOS, so without a macOS job
# they would only ever run on a developer's laptop.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json declares engines.node >= 18, so we verify the floor
        # (EOL but still supported by us) through current LTS.
        node: ["18", "20", "22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  test-macos:
    # One Node version is enough here: the Node matrix above already covers
    # the language side, and this job is about macOS itself.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # A macOS-only test that skips here would pass silently, which is the
      # exact gap this job exists to close. Fail if any did.
      - name: No macOS test was skipped
        run: |
          npm test 2>&1 | tee test-output.txt > /dev/null
          if grep -E "^# skipped [1-9]" test-output.txt; then
            echo "Some tests skipped on macOS; they should all run here."
            exit 1
          fi
